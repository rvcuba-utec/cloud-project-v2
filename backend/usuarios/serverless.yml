org: ${env:SLS_ORG}
service: api-usuarios

custom:
  cors: ${file(../serverless.common.yml):cors}
  autorizador: ${file(../serverless.common.yml):authorizer}

provider:
  name: aws
  apiGateway: ${file(../serverless.common.yml):apiGateway}
  runtime: python3.12
  region: ${env:AWS_REGION, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  logRetentionInDays: ${file(../serverless.common.yml):retencionLogs.${sls:stage}}
  timeout: 25
  memorySize: 256
  iam:
    role: arn:aws:iam::${param:cuenta, aws:accountId}:role/LabRole
  environment:
    SERVICE_NAME: usuarios
    STAGE: ${sls:stage}
    TABLE_NAME: ${sls:stage}-t_usuarios
    TABLA_SESIONES: ${sls:stage}-t_sesiones
    # Por nombre, no por salida de CloudFormation: Usuarios se despliega antes que Técnicos.
    TECNICOS_FN: api-tecnicos-${sls:stage}-existeInterno

package:
  patterns: ['!tests/**', '!**/__pycache__/**']

functions:
  validarToken:
    handler: handlers/validar_token.lambda_handler
  login:
    environment:
      PASSWORD_PEPPER_SECRET: ${file(../serverless.common.yml):pepper.${sls:stage}}
    handler: handlers/login.lambda_handler
    memorySize: 512   # PBKDF2 usa CPU, y esta crece con la memoria
    events:
      - http: { path: auth/login, method: post, cors: "${self:custom.cors}" }
  crear:
    environment:
      PASSWORD_PEPPER_SECRET: ${file(../serverless.common.yml):pepper.${sls:stage}}
    handler: handlers/crear.lambda_handler
    memorySize: 512
    events:
      - http: { path: usuarios, method: post, cors: "${self:custom.cors}", authorizer: "${self:custom.autorizador}" }
  listar:
    handler: handlers/listar.lambda_handler
    events:
      - http: { path: usuarios, method: get, cors: "${self:custom.cors}", authorizer: "${self:custom.autorizador}" }
  yo:
    handler: handlers/yo.lambda_handler
    events:
      - http: { path: usuarios/me, method: get, cors: "${self:custom.cors}", authorizer: "${self:custom.autorizador}" }
  actualizar:
    handler: handlers/actualizar.lambda_handler
    events:
      - http: { path: 'usuarios/{usuario_id}', method: patch, cors: "${self:custom.cors}", authorizer: "${self:custom.autorizador}" }

resources:
  - Resources:
      PermisoAutorizador:
        Type: AWS::Lambda::Permission
        Properties:
          FunctionName: { Fn::GetAtt: [ValidarTokenLambdaFunction, Arn] }
          Action: lambda:InvokeFunction
          Principal: apigateway.amazonaws.com
          SourceArn: arn:aws:execute-api:${self:provider.region}:${param:cuenta, aws:accountId}:${self:provider.apiGateway.restApiId}/authorizers/${self:custom.autorizador.authorizerId}
      TablaUsuarios:
        Type: AWS::DynamoDB::Table
        Properties:
          TableName: ${self:provider.environment.TABLE_NAME}
          BillingMode: PAY_PER_REQUEST
          AttributeDefinitions:
            - { AttributeName: PK, AttributeType: S }
            - { AttributeName: SK, AttributeType: S }
          KeySchema:
            - { AttributeName: PK, KeyType: HASH }
            - { AttributeName: SK, KeyType: RANGE }
      TablaSesiones:
        Type: AWS::DynamoDB::Table
        Properties:
          TableName: ${self:provider.environment.TABLA_SESIONES}
          BillingMode: PAY_PER_REQUEST
          AttributeDefinitions:
            - { AttributeName: token_hash, AttributeType: S }
          KeySchema:
            - { AttributeName: token_hash, KeyType: HASH }

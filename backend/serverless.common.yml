# El stack compartido es dueño del gateway, su autorizador y las rutas comunes.
cors:
  origin: '*'
  headers: [Content-Type, Authorization, Idempotency-Key]

apiGateway:
  restApiId: ${param:restApiId, cf:trazora-shared-${sls:stage}.RestApiId}
  restApiRootResourceId: ${param:rootId, cf:trazora-shared-${sls:stage}.RootId}

rutasVisitas:
  /visitas: ${param:visitasId, cf:trazora-shared-${sls:stage}.VisitasId}
  '/visitas/{visita_id}': ${param:visitaId, cf:trazora-shared-${sls:stage}.VisitaId}

authorizer:
  type: CUSTOM
  authorizerId: ${param:authorizerId, cf:trazora-shared-${sls:stage}.AuthorizerId}

apiUrl: https://${self:provider.apiGateway.restApiId}.execute-api.${self:provider.region}.amazonaws.com/${sls:stage}

retencionLogs: { dev: 7, test: 7, prod: 14 }

tenants: CLIMALIMA,FRIOSUR,TECNINORTE

origenes:
  dev: ['${param:origenFrontend}', 'http://localhost:5173']
  test: ['${param:origenFrontend}', 'http://localhost:5173']
  prod: ['${param:origenFrontend}']

pepper:
  dev: ${env:TRAZORA_PEPPER_DEV, ''}
  test: trazora/test/usuarios/password-pepper
  prod: trazora/prod/usuarios/password-pepper

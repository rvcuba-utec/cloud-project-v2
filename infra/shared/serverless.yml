org: ${env:SLS_ORG}
service: trazora-shared

custom:
  cidr: { dev: 10.80.0.0/16, test: 10.81.0.0/16, prod: 10.82.0.0/16 }

provider:
  name: aws
  region: ${env:AWS_REGION, 'us-east-1'}
  stage: ${opt:stage, 'dev'}

  stackParameters:
    - { ParameterKey: CertificadoAlb, ParameterValue: "${param:certificadoAlb, ''}" }
    - { ParameterKey: DominioAlb, ParameterValue: "${param:dominioAlb, ''}" }

resources:
  Description: Entrada REST privada y mensajería compartida del ambiente Trazora.
  Metadata:
    AWSToolsMetrics: { AWSAgentToolkit: aws-cloudformation@3 }
  Parameters:
    CertificadoAlb:
      Type: String
      AllowedPattern: 'arn:[a-z0-9-]+:acm:[a-z0-9-]+:[0-9]{12}:certificate/[a-fA-F0-9-]{36}'
    DominioAlb:
      Type: String
      AllowedPattern: '([a-zA-Z0-9-]+\.)+[a-zA-Z0-9-]+'
  Resources:
    VpcIngreso:
      Type: AWS::EC2::VPC
      Metadata:
        com.aws.cloudformation.Context: { why: Ingreso privado por ambiente, must: Conservar las dos subredes aisladas }
      Properties:
        CidrBlock: ${self:custom.cidr.${sls:stage}}
        EnableDnsSupport: true
        EnableDnsHostnames: true
        Tags: [{ Key: Name, Value: 'trazora-${sls:stage}' }]
    SubredA:
      Type: AWS::EC2::Subnet
      Properties:
        VpcId: { Ref: VpcIngreso }
        AvailabilityZoneId: ${param:azIdA, 'use1-az1'}
        CidrBlock: { Fn::Select: [0, { Fn::Cidr: [{ Fn::GetAtt: [VpcIngreso, CidrBlock] }, 2, 8] }] }
        MapPublicIpOnLaunch: false
    SubredB:
      Type: AWS::EC2::Subnet
      Properties:
        VpcId: { Ref: VpcIngreso }
        AvailabilityZoneId: ${param:azIdB, 'use1-az2'}
        CidrBlock: { Fn::Select: [1, { Fn::Cidr: [{ Fn::GetAtt: [VpcIngreso, CidrBlock] }, 2, 8] }] }
        MapPublicIpOnLaunch: false
    GrupoAlb:
      Type: AWS::EC2::SecurityGroup
      Metadata:
        com.aws.cloudformation.Context: { why: El ALB invoca Lambda como servicio, must: Solo el enlace puede abrir conexiones entrantes }
      Properties:
        GroupDescription: ALB interno para targets Lambda
        VpcId: { Ref: VpcIngreso }
        # Una regla explícita evita la salida abierta que EC2 asigna por defecto.
        SecurityGroupEgress: [{ IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 127.0.0.1/32 }]
    GrupoEnlace:
      Type: AWS::EC2::SecurityGroup
      Metadata:
        com.aws.cloudformation.Context: { why: ENI de API Gateway, must: Permitir salida solo al ALB por HTTPS }
      Properties:
        GroupDescription: VPC Link a ALB por HTTPS
        VpcId: { Ref: VpcIngreso }
        SecurityGroupEgress:
          - { IpProtocol: tcp, FromPort: 443, ToPort: 443, DestinationSecurityGroupId: { Ref: GrupoAlb } }
    EntradaAlb:
      Type: AWS::EC2::SecurityGroupIngress
      Properties:
        GroupId: { Ref: GrupoAlb }
        SourceSecurityGroupId: { Ref: GrupoEnlace }
        IpProtocol: tcp
        FromPort: 443
        ToPort: 443
    EnlacePrivado:
      Type: AWS::ApiGatewayV2::VpcLink
      Metadata:
        com.aws.cloudformation.Context: { why: Conecta el API REST al ALB, must: Usar subredes y grupo del mismo ambiente }
      Properties:
        Name: trazora-${sls:stage}
        SubnetIds: &subredes [{ Ref: SubredA }, { Ref: SubredB }]
        SecurityGroupIds: [{ Ref: GrupoEnlace }]
    AlbInterno:
      Type: AWS::ElasticLoadBalancingV2::LoadBalancer
      Metadata:
        com.aws.cloudformation.Context: { why: Distribuye las rutas a targets Lambda, must: Mantener el esquema internal }
      Properties:
        Type: application
        Scheme: internal
        Subnets: *subredes
        SecurityGroups: [{ Ref: GrupoAlb }]
        LoadBalancerAttributes:
          - { Key: routing.http.drop_invalid_header_fields.enabled, Value: 'true' }
          - { Key: routing.http.desync_mitigation_mode, Value: strictest }
    ListenerPrivado:
      Type: AWS::ElasticLoadBalancingV2::Listener
      Metadata:
        com.aws.cloudformation.Context: { why: Protege tokens en tránsito, must: Certificado ACM válido para el nombre que verifica el API }
      Properties:
        LoadBalancerArn: { Ref: AlbInterno }
        Protocol: HTTPS
        Port: 443
        Certificates: [{ CertificateArn: { Ref: CertificadoAlb } }]
        SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
        DefaultActions:
          - Type: fixed-response
            FixedResponseConfig:
              StatusCode: '404'
              ContentType: application/json
              MessageBody: '{"error":{"codigo":"NO_ENCONTRADO","mensaje":"Ruta no encontrada","detalle":{}}}'
    TemaEventos:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: ${sls:stage}-fsm-eventos
    ApiTrazora:
      Type: AWS::ApiGateway::RestApi
      Properties:
        Name: trazora-${sls:stage}
        EndpointConfiguration: { Types: [REGIONAL] }
    Visitas:
      Type: AWS::ApiGateway::Resource
      Properties:
        RestApiId: { Ref: ApiTrazora }
        ParentId: { Fn::GetAtt: [ApiTrazora, RootResourceId] }
        PathPart: visitas
    Visita:
      Type: AWS::ApiGateway::Resource
      Properties:
        RestApiId: { Ref: ApiTrazora }
        ParentId: { Ref: Visitas }
        PathPart: '{visita_id}'
    Autorizador:
      Metadata:
        com.aws.cloudformation.Context: { why: Valida la sesión antes del enlace privado, must: Revisar las cabeceras de cada petición con TTL cero }
      Type: AWS::ApiGateway::Authorizer
      Properties:
        Name: trazora-${sls:stage}-sesion
        RestApiId: { Ref: ApiTrazora }
        Type: REQUEST
        IdentitySource: method.request.header.Authorization
        AuthorizerResultTtlInSeconds: 0
        AuthorizerUri:
          Fn::Sub: 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:api-usuarios-${sls:stage}-validarToken/invocations'
    Default4XX:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        RestApiId: { Ref: ApiTrazora }
        ResponseType: DEFAULT_4XX
        ResponseParameters: &corsErrores
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,Idempotency-Key'"
    Default5XX:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        RestApiId: { Ref: ApiTrazora }
        ResponseType: DEFAULT_5XX
        ResponseParameters: *corsErrores
  Outputs:
    VpcLinkId:
      Value: { Ref: EnlacePrivado }
    AlbArn:
      Value: { Ref: AlbInterno }
    ListenerArn:
      Value: { Ref: ListenerPrivado }
    AlbUrl:
      Value: { Fn::Sub: 'https://${DominioAlb}' }
    TopicArn:
      Value: { Ref: TemaEventos }
    RestApiId:
      Value: { Ref: ApiTrazora }
    RootId:
      Value: { Fn::GetAtt: [ApiTrazora, RootResourceId] }
    VisitasId:
      Value: { Ref: Visitas }
    VisitaId:
      Value: { Ref: Visita }
    AuthorizerId:
      Value: { Ref: Autorizador }
    ApiUrl:
      Value:
        Fn::Sub: 'https://${ApiTrazora}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${sls:stage}'
